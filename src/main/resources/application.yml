spring:
  profiles:
    active: local

  application:
    name: backend

  session:
    store-type: none

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8080/login/oauth2/code/kakao"
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

notification:
  push:
    # false면 실제 발송 대신 로그만 남김 (개발/CI용)
    enabled: ${NOTIFICATION_PUSH_ENABLED:true}
  vapid:
    subject: ${VAPID_SUBJECT:mailto:noreply@w2m.example}
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
  # 알림 클릭 시 이동할 프론트엔드 베이스 URL
  web-base-url: ${NOTIFICATION_WEB_BASE_URL:http://localhost:5173}

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG

springdoc:
  swagger-ui:
    persist-authorization: true
#    Swagger 화면에서 Authorize에 입력한 인증 정보(토큰)를 브라우저에 저장해서 계속 유지
