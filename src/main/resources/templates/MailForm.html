<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LOCOCO 이메일 인증</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 20px auto; background-color: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        .header { text-align: center; padding-bottom: 20px; border-bottom: 1px solid #eeeeee; }
        .header h2 { color: #333333; }
        .content { padding: 20px 0; line-height: 1.6; color: #666666; }
        .code-box { text-align: center; margin: 20px 0; padding: 15px; background-color: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 5px; font-size: 24px; font-weight: bold; color: #007BFF; }
        .footer { text-align: center; font-size: 12px; color: #aaaaaa; border-top: 1px solid #eeeeee; padding-top: 20px; margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>[Where2Meet] 이메일 인증코드</h2>
    </div>
    <div class="content">
        <p th:text="${to} + '님, 안녕하세요.'"></p>
        <p>아래 인증코드를 입력하여 이메일 인증을 완료해 주세요.</p>
        <div class="code-box" th:text="${verificationCode}"></div>
        <p>인증코드는 <strong th:text="${minutes}"></strong>분 동안 유효합니다.</p>
    </div>
    <div class="footer">
        <p>본 메일은 발신전용입니다. 문의사항은 고객센터를 이용해 주세요.</p>
    </div>
</div>
</body>
</html>
